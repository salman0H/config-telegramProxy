name: Check Subscribers (Dry Run)

on:
  workflow_dispatch: {}

jobs:
  check-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decrypt Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -f "bot_state.enc" ]; then
            openssl aes-256-cbc -d -pbkdf2 -md sha256 -in bot_state.enc -out bot_state.tar.gz -pass env:DB_PASSWORD
            tar -xzf bot_state.tar.gz
          fi

      - name: Run Dry Run Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/dry_run.py
