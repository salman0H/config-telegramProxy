name: Telegram Notifier

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to send'
        required: true
        default: 'proxy'
        type: choice
        options:
          - proxy
          - config
          - both

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pyperclip tabulate

      - name: Decrypt Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -f "bot_state.enc" ]; then
            openssl aes-256-cbc -d -pbkdf2 -in bot_state.enc -out bot_state.tar.gz -pass pass:"$DB_PASSWORD"
            tar -xzf bot_state.tar.gz
          fi

      - name: Run Notify Script
        run: |
          python scripts/notify_telegram.py poll
          TARGET="${{ github.event.inputs.target || 'proxy' }}"
          python scripts/notify_telegram.py $TARGET

      - name: Encrypt and Commit Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          tar -czf bot_state.tar.gz subscribers.json scripts/telegram_offset.json 2>/dev/null || true
          openssl aes-256-cbc -salt -pbkdf2 -in bot_state.tar.gz -out bot_state.enc -pass pass:"$DB_PASSWORD"
          
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.enc
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: secure update bot state (encrypted)"
            git push
          else
            echo "No changes to commit"
          fi