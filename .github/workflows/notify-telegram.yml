name: Telegram Notifier

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to send'
        required: true
        default: 'proxy'
        type: choice
        options:
          - proxy
          - config
          - both

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pyperclip tabulate

      - name: Run Notify Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TARGET="${{ github.event.inputs.target || 'proxy' }}"
          python scripts/notify_telegram.py $TARGET