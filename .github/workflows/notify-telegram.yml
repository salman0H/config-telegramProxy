name: Telegram Notifier

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to send'
        required: true
        default: 'both'
        type: choice
        options:
          - proxy
          - config
          - both

# All workflows mutate the same encrypted subscriber/offset state.
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Decrypt Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -f "bot_state.enc" ]; then
            openssl aes-256-cbc -d -pbkdf2 -md sha256 -in bot_state.enc -out bot_state.tar.gz -pass env:DB_PASSWORD
            tar -xzf bot_state.tar.gz
          fi

      - name: Run script
        run: |
          python3 main.py --mode 1 --source 3 --export all
          python3 main.py --mode 2 --source 3 --export all
        
      - name: Commit Fetched Files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ proxy/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: fetch latest proxies and configs from external repo"
            git pull origin main --rebase --autostash
            git push
          fi

      - name: Run Notify Script
        run: |
          python3 scripts/notify_telegram.py poll
          TARGET="${{ github.event.inputs.target || 'both' }}"
          python3 scripts/notify_telegram.py $TARGET

      - name: Encrypt and Commit Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ ! -f subscribers.json ]; then
            printf '{}\n' > subscribers.json
          fi
          mkdir -p scripts
          if [ ! -f scripts/telegram_offset.json ]; then
            printf '{}\n' > scripts/telegram_offset.json
          fi
          
          tar -czf bot_state.tar.gz subscribers.json scripts/telegram_offset.json
          openssl aes-256-cbc -salt -pbkdf2 -md sha256 -in bot_state.tar.gz -out bot_state.enc -pass env:DB_PASSWORD
          
          git add bot_state.enc
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: secure update bot state (encrypted)"
            git pull origin main --rebase --autostash
            git push
          fi
