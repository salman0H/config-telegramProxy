name: Broadcast config/proxy updates to Telegram

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "proxy/**"
  workflow_dispatch: {}

permissions:
  contents: write

# All workflows mutate the same encrypted subscriber/offset state.
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decrypt Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -f "bot_state.enc" ]; then
            openssl aes-256-cbc -d -pbkdf2 -md sha256 -in bot_state.enc -out bot_state.tar.gz -pass env:DB_PASSWORD
            tar -xzf bot_state.tar.gz
          fi

      - name: Poll Telegram for bot commands since last run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/notify_telegram.py poll

      - name: Detect which folder changed
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "target=both" >> "$GITHUB_OUTPUT"
          else
            CHANGED_CONFIG=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- config/ | wc -l)
            CHANGED_PROXY=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- proxy/ | wc -l)
            if [ "$CHANGED_CONFIG" -gt 0 ] && [ "$CHANGED_PROXY" -gt 0 ]; then
              echo "target=both" >> "$GITHUB_OUTPUT"
            elif [ "$CHANGED_CONFIG" -gt 0 ]; then
              echo "target=config" >> "$GITHUB_OUTPUT"
            elif [ "$CHANGED_PROXY" -gt 0 ]; then
              echo "target=proxy" >> "$GITHUB_OUTPUT"
            else
              echo "target=both" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Broadcast to subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/notify_telegram.py ${{ steps.changed.outputs.target }}

      - name: Encrypt and Commit Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ ! -f subscribers.json ]; then
            printf '{}\n' > subscribers.json
          fi
          mkdir -p scripts
          if [ ! -f scripts/telegram_offset.json ]; then
            printf '{}\n' > scripts/telegram_offset.json
          fi
          
          tar -czf bot_state.tar.gz subscribers.json scripts/telegram_offset.json
          openssl aes-256-cbc -salt -pbkdf2 -md sha256 -in bot_state.tar.gz -out bot_state.enc -pass env:DB_PASSWORD
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.enc
          if ! git diff --cached --quiet; then
            git commit -m "chore: secure update bot state (encrypted)"
            git pull origin main --rebase --autostash
            git push
          else
            echo "No bot-state changes to commit."
          fi