name: Scheduled config/proxy refresh

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours, UTC
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyperclip tabulate

      - name: Test MTProto proxies
        run: python3 main.py --mode 2 --source 3 --export all

      - name: Poll Telegram for bot commands since last run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python3 scripts/notify_telegram.py poll

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ proxy/ subscribers.json bot_requests_log.json scripts/telegram_offset.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Scheduled auto-update configs/proxies + bot state"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python3 scripts/notify_telegram.py both